name: Build NOVA OS Alpha 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "os/**"
      - "docs/**"
      - ".github/workflows/build-nova.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso squashfs-tools

      - name: Prepare NOVA live-build tree
        run: |
          mkdir -p build
          cp -r os/live/* build/
          cd build
          chmod +x auto/config auto/build
          ./auto/config
          ./auto/build

      - name: Generate checksum
        run: |
          cd build
          sha256sum live-image-amd64.hybrid.iso > SHA256SUMS

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nova-alpha1-live-iso
          path: |
            build/live-image-amd64.hybrid.iso
            build/SHA256SUMS
          if-no-files-found: error
